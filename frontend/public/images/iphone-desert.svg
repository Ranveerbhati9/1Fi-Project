<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" width="100%" height="100%">
  <defs>
    <!-- Titanium Body Gradient: Desert Titanium warm bronze-gold -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B66" />
      <stop offset="35%" stop-color="#DE864B" />
      <stop offset="70%" stop-color="#CB7338" />
      <stop offset="100%" stop-color="#AF5922" />
    </linearGradient>

    <!-- Edge Highlight -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD5B5" />
      <stop offset="50%" stop-color="#E3894E" />
      <stop offset="100%" stop-color="#9C4C1B" />
    </linearGradient>

    <!-- Camera Plateau Gradient -->
    <linearGradient id="cameraPlateau" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A874" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BC652C" stop-opacity="0.95" />
    </linearGradient>

    <!-- Lens Glass Reflection -->
    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <radialGradient id="lensReflect" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.9" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#7C2D12" flood-opacity="0.25"/>
    </filter>
    <filter id="bumpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#542007" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Phone Body Outer Frame with drop shadow -->
  <rect x="25" y="20" width="290" height="590" rx="46" fill="url(#edgeGrad)" filter="url(#phoneShadow)" />
  <!-- Inner Glass Back Plate -->
  <rect x="29" y="24" width="282" height="582" rx="42" fill="url(#bodyGrad)" />

  <!-- Subtle Frosted Glass Sheen -->
  <path d="M29 24 Q 170 120 311 24 L 311 180 Q 170 100 29 200 Z" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Camera Plateau (Top Left) -->
  <rect x="42" y="38" width="138" height="146" rx="34" fill="url(#cameraPlateau)" filter="url(#bumpShadow)" stroke="#FFD8BE" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Lens 1: Top Camera -->
  <circle cx="82" cy="78" r="26" fill="#A7511B" stroke="#FDE4D0" stroke-width="2"/>
  <circle cx="82" cy="78" r="22" fill="url(#lensGlass)"/>
  <circle cx="82" cy="78" r="18" fill="url(#lensReflect)"/>
  <circle cx="76" cy="72" r="6" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Lens 2: Bottom-Left Camera -->
  <circle cx="82" cy="144" r="26" fill="#A7511B" stroke="#FDE4D0" stroke-width="2"/>
  <circle cx="82" cy="144" r="22" fill="url(#lensGlass)"/>
  <circle cx="82" cy="144" r="18" fill="url(#lensReflect)"/>
  <circle cx="76" cy="138" r="6" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Lens 3: Right Camera -->
  <circle cx="140" cy="111" r="26" fill="#A7511B" stroke="#FDE4D0" stroke-width="2"/>
  <circle cx="140" cy="111" r="22" fill="url(#lensGlass)"/>
  <circle cx="140" cy="111" r="18" fill="url(#lensReflect)"/>
  <circle cx="134" cy="105" r="6" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- TrueTone Flash (Top Right) -->
  <circle cx="140" cy="65" r="10" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <circle cx="140" cy="65" r="5" fill="#FDE68A"/>

  <!-- LiDAR Sensor (Bottom Right) -->
  <circle cx="140" cy="155" r="8" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Subtle Apple Logo Emboss in Center -->
  <g transform="translate(150, 305) scale(0.65)" opacity="0.3">
    <path d="M22 0C25 4 21 9 17 9C14 9 13 6 15 2C17 -1 20 -1 22 0Z" fill="#FFFFFF"/>
    <path d="M30 18C30 14 34 11 36 10C32 5 26 5 24 6C19 6 16 8 13 8C10 8 7 6 3 6C-3 7 -8 15 -8 24C-8 32 -3 43 2 49C5 53 8 57 12 57C16 57 17 54 22 54C26 54 27 57 32 57C36 57 39 53 42 49C44 46 45 44 46 41C37 38 30 29 30 18Z" fill="#FFFFFF"/>
  </g>

  <!-- Side buttons outline -->
  <rect x="23" y="110" width="2" height="26" rx="1" fill="#B35B22" />
  <rect x="23" y="150" width="2" height="42" rx="1" fill="#B35B22" />
  <rect x="23" y="202" width="2" height="42" rx="1" fill="#B35B22" />
  <rect x="315" y="160" width="2" height="60" rx="1" fill="#B35B22" />
</svg>
